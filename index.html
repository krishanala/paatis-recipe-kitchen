<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paati's Recipe</title>
    <meta name="description" content="Learn about Deepavali with Paati, earn the ingredients, then make your own muruku." />
    <link rel="icon" href="assets/art/diya.svg" type="image/svg+xml" />
    <!-- Add to Home screen: opens full screen and sideways, with Paati as the icon. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/paati/icon-192.png" />
    <meta name="theme-color" content="#fffbf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Paati's Recipe" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kalam&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fffbf5;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
        height: 100dvh; /* follows mobile browser toolbars */
        touch-action: none;
        background: #fffbf5; /* also the full-screen backdrop; each screen sets its own colour */
      }
      /* The kitchen is landscape. On a phone or small tablet held upright, ask for a turn. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        box-sizing: border-box;
        background: #fffbf5;
        color: #131927;
        font: 500 18px/1.5 Inter, system-ui, sans-serif;
        text-align: center;
      }
      #rotate img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #ffc654;
      }
      #rotate strong {
        display: block;
        margin-bottom: 4px;
        color: #212967;
        font-size: 24px;
        font-weight: 700;
      }
      #rotate .turn {
        width: 56px;
        height: 36px;
        border: 4px solid #f77700;
        border-radius: 8px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .turn { animation: none; transform: rotate(90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 1000px) {
        #rotate { display: flex; }
        #game { visibility: hidden; }
      }
      /* The remembrance note: text fields laid over the parchment on the canvas (NoteScene places them). */
      .note-field {
        position: fixed;
        z-index: 5;
        box-sizing: border-box;
        margin: 0;
        padding: 0 0.3em;
        border: 0;
        border-bottom: 2px dashed rgba(122, 74, 40, 0.45);
        border-radius: 0;
        background: transparent;
        color: #4a2a14;
        caret-color: #c2410c;
        font-family: Kalam, "Segoe Print", "Bradley Hand", cursive;
        line-height: 1.4;
        outline: none;
        resize: none;
        appearance: none;
        -webkit-appearance: none;
        touch-action: manipulation;
      }
      textarea.note-field {
        padding: 0.2em 0.4em;
        border: 2px dashed rgba(122, 74, 40, 0.3);
        border-radius: 12px;
        overflow: hidden auto;
      }
      @keyframes note-in {
        from { opacity: 0; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .note-field { animation: note-in 0.36s ease-out; }
      }
      .note-field::placeholder {
        color: rgba(74, 42, 20, 0.42);
      }
      .note-field:focus {
        border-color: #f77700;
        border-style: solid;
      }
      noscript {
        display: block;
        padding: 24px;
        color: #131927;
        font: 16px/1.5 Inter, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="status">
      <img src="assets/paati/avatar.png" alt="" />
      <p><strong>Happy Deepavali!</strong>Please turn your device sideways to cook with Paati.</p>
      <div class="turn" aria-hidden="true"></div>
    </div>
    <noscript>Paati's Recipe needs JavaScript to run.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
